server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras obligatorias para WebAssembly y Threads en Godot 4 Web
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin "*" always;

    # Soporte para compresión y tipos MIME correctos
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/javascript js;
        application/octet-stream pck;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy opcional para WebSocket si se unifica bajo el mismo dominio
    location /ws {
        proxy_pass http://game-server:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
